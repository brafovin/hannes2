// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 550;
canvas.width = W;
canvas.height = H;

// ============================================================
// GAME STATE
// ============================================================
const GRAVITY = 0.5;
const MAX_FALL = 15;
const MOVE_SPEED = 4;
const JUMP_FORCE = -13;
const SPRING_FORCE = -22;
const PLAYER_W = 32;
const PLAYER_H = 40;

let state = 'start'; // 'start','play','levelcomplete','gameover','win'
let currentLevel = 0;
let lives = 3;
let totalTime = 0;
let levelTime = 0;
let lastTimestamp = 0;
let shakeTimer = 0;
let flashTimer = 0;
let levelCompleteTimer = 0;

// Platform runtime state
let platforms = [];
let checkpoints = [];
let goal = null;

// ── Falling Red Blocks ──────────────────────────────────────
// How many blocks spawn per level (index = level 0..4)
const BLOCKS_PER_LEVEL = [2, 4, 7, 11, 16];
let fallingBlocks = [];
let blockSpawnTimer = 0;
// Spawn interval in ms: gets shorter each level
const BLOCK_SPAWN_INTERVAL = [1800, 1300, 950, 650, 400];

function spawnFallingBlock() {
  const ld = LEVELS[currentLevel];
  // Spawn above the visible area at a random x near the player
  const spread = 300;
  const spawnX = player.x - spread + Math.random() * spread * 2;
  const sz = 18 + Math.random() * 18; // size 18–36
  fallingBlocks.push({
    x: spawnX,
    y: camY - 60,
    w: sz, h: sz,
    vy: 3 + Math.random() * 3,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 0.12,
    alive: true,
    warningX: spawnX, // for ground shadow
  });
}

function updateFallingBlocks(dt) {
  if (state !== 'play') return;
  const dtF = dt / 16.67;
  const count = BLOCKS_PER_LEVEL[currentLevel];
  const interval = BLOCK_SPAWN_INTERVAL[currentLevel];

  blockSpawnTimer += dt;
  // Spawn up to `count` blocks concurrently; keep refilling
  if (blockSpawnTimer >= interval && fallingBlocks.filter(b => b.alive).length < count) {
    blockSpawnTimer = 0;
    spawnFallingBlock();
  }

  fallingBlocks.forEach(b => {
    if (!b.alive) return;
    b.vy = Math.min(b.vy + 0.25 * dtF, 18);
    b.y += b.vy * dtF;
    b.rotation += b.rotSpeed * dtF;

    // Remove when far below screen
    if (b.y > camY + H + 200) {
      b.alive = false;
    }

    // Hit player
    if (player.invincible === 0 &&
        rectOverlap(player.x, player.y, player.w, player.h, b.x, b.y, b.w, b.h)) {
      b.alive = false;
      die();
    }
  });

  // Clean up dead blocks
  if (fallingBlocks.length > 60) fallingBlocks = fallingBlocks.filter(b => b.alive);
}

function drawFallingBlocks() {
  fallingBlocks.forEach(b => {
    if (!b.alive) return;

    // Shadow on nearest platform below (just draw at bottom of screen area)
    const shadowY = camY + H - 30;
    if (b.y < shadowY) {
      const dist = shadowY - b.y;
      const alpha = Math.max(0, 0.4 - dist / (H * 1.5));
      const scale = Math.max(0.3, 1 - dist / H);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(b.x - camX + b.w / 2, shadowY - camY, b.w * scale * 0.6, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Block
    ctx.save();
    ctx.translate(b.x - camX + b.w / 2, b.y - camY + b.h / 2);
    ctx.rotate(b.rotation);
    // Glow
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 12;
    // Dark shadow offset
    ctx.fillStyle = '#800000';
    ctx.fillRect(-b.w / 2 + 3, -b.h / 2 + 3, b.w, b.h);
    // Main red block
    ctx.fillStyle = '#e53935';
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    // Highlight
    ctx.fillStyle = 'rgba(255,180,180,0.45)';
    ctx.fillRect(-b.w / 2 + 2, -b.h / 2 + 2, b.w * 0.45, b.h * 0.3);
    // Skull icon
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `bold ${Math.floor(b.w * 0.55)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('☠', 0, 1);
    ctx.restore();
  });
  ctx.textBaseline = 'alphabetic';
}

// Camera
let camX = 0, camY = 0;
let camTargetX = 0, camTargetY = 0;

// Clouds parallax
let clouds = [];

// Player
const player = {
  x: 100, y: 200,
  vx: 0, vy: 0,
  w: PLAYER_W, h: PLAYER_H,
  onGround: false,
  dir: 1,
  squash: 0,    // frames of squash
  stretch: 0,   // frames of stretch
  invincible: 0,
  blinkOn: true,
  checkpointX: 100,
  checkpointY: 200,
};

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') handleEnter();

  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function handleEnter() {
  if (state === 'start') {
    startGame();
  } else if (state === 'levelcomplete') {
    if (currentLevel < LEVELS.length - 1) {
      currentLevel++;
      loadLevel(currentLevel);
      state = 'play';
    } else {
      state = 'win';
    }
  } else if (state === 'gameover') {
    lives = 3; currentLevel = 0; totalTime = 0;
    loadLevel(0);
    state = 'play';
  } else if (state === 'win') {
    lives = 3; currentLevel = 0; totalTime = 0;
    loadLevel(0);
    state = 'play';
  }
}

function startGame() {
  lives = 3; currentLevel = 0; totalTime = 0;
  loadLevel(0);
  state = 'play';
}

// ============================================================
// LEVEL LOADING
// ============================================================
function loadLevel(idx) {
  const ld = LEVELS[idx];
  levelTime = 0;

  // Build platform runtime objects
  platforms = ld.platforms.map((p, i) => ({
    ...p,
    ox: p.x, oy: p.y,    // original position
    t: Math.random() * Math.PI * 2, // phase offset
    crumbleState: 'solid', // solid, shaking, falling, respawning
    crumbleTimer: 0,
    crumbleY: p.y,
    id: i
  }));

  checkpoints = ld.checkpoints.map(c => ({ ...c, activated: false }));
  goal = { ...ld.goal };

  // Reset player
  player.x = 100;
  player.y = 200;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.squash = 0; player.stretch = 0;
  player.invincible = 0;
  player.checkpointX = 100;
  player.checkpointY = 200;

  // Reset falling blocks
  fallingBlocks = [];
  blockSpawnTimer = 0;

  // Camera
  camX = player.x - W / 2;
  camY = player.y - H / 2;

  // Generate clouds
  clouds = [];
  const lw = ld.width + 800;
  for (let layer = 0; layer < 3; layer++) {
    for (let i = 0; i < 12; i++) {
      clouds.push({
        x: Math.random() * lw,
        y: 30 + Math.random() * 200,
        w: 60 + Math.random() * 100,
        h: 20 + Math.random() * 30,
        layer: layer,
        speed: 0.1 + layer * 0.15
      });
    }
  }
}

// ============================================================
// RESPAWN / DEATH
// ============================================================
function die() {
  lives--;
  flashTimer = 18; // ~0.3s
  shakeTimer = 12;
  if (lives <= 0) {
    state = 'gameover';
    return;
  }
  respawn();
}

function respawn() {
  player.x = player.checkpointX;
  player.y = player.checkpointY - PLAYER_H - 10;
  player.vx = 0; player.vy = 0;
  player.invincible = 60; // 1 second at 60fps
}

// ============================================================
// PLATFORM HELPERS
// ============================================================
function getPlatformRect(p) {
  if (p.crumbleState === 'falling') {
    return { x: p.x, y: p.crumbleY, w: p.w, h: p.h };
  }
  return { x: p.x, y: p.y, w: p.w, h: p.h };
}

function updatePlatforms(dt) {
  const dtFactor = dt / 16.67; // normalize to 60fps
  platforms.forEach(p => {
    if (p.type === 'moving') {
      p.t += p.moveSpeed * dtFactor * 0.05;
      if (p.moveAxis === 'x') {
        p.x = p.ox + Math.sin(p.t) * p.moveRange;
      } else {
        p.y = p.oy + Math.sin(p.t) * p.moveRange;
      }
    }
    if (p.type === 'crumble') {
      if (p.crumbleState === 'shaking') {
        p.crumbleTimer += dt;
        if (p.crumbleTimer >= 700) { // 0.7s of shaking (0.8s total contact)
          p.crumbleState = 'falling';
          p.crumbleTimer = 0;
          p.crumbleY = p.y;
        }
      } else if (p.crumbleState === 'falling') {
        p.crumbleTimer += dt;
        p.crumbleY += 4 * dtFactor;
        if (p.crumbleTimer >= 1500) {
          p.crumbleState = 'respawning';
          p.crumbleTimer = 0;
        }
      } else if (p.crumbleState === 'respawning') {
        p.crumbleTimer += dt;
        if (p.crumbleTimer >= 3000) {
          p.crumbleState = 'solid';
          p.crumbleTimer = 0;
          p.crumbleY = p.y;
        }
      }
    }
  });
}

// ============================================================
// COLLISION
// ============================================================
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolveCollisions() {
  player.onGround = false;
  let landedOnCrumble = null;

  for (const p of platforms) {
    if (p.type === 'crumble' && (p.crumbleState === 'falling' || p.crumbleState === 'respawning')) continue;

    const pr = getPlatformRect(p);
    const px = pr.x, py = pr.y, pw = pr.w, ph = pr.h;

    if (!rectOverlap(player.x, player.y, player.w, player.h, px, py, pw, ph)) continue;

    const overlapLeft  = (player.x + player.w) - px;
    const overlapRight = (px + pw) - player.x;
    const overlapTop   = (player.y + player.h) - py;
    const overlapBottom= (py + ph) - player.y;

    const minX = Math.min(overlapLeft, overlapRight);
    const minY = Math.min(overlapTop, overlapBottom);

    if (minY < minX) {
      if (overlapTop < overlapBottom) {
        // Landing on top
        player.y = py - player.h;
        if (player.vy > 0) {
          // Squash on landing
          if (player.vy > 6) player.squash = 8;
          player.vy = 0;
        }
        player.onGround = true;

        // Move with moving platform
        if (p.type === 'moving') {
          const prevX = p.ox + Math.sin(p.t - p.moveSpeed * 0.05) * (p.moveAxis === 'x' ? p.moveRange : 0);
          const prevY = p.oy + Math.sin(p.t - p.moveSpeed * 0.05) * (p.moveAxis === 'y' ? p.moveRange : 0);
          if (p.moveAxis === 'x') player.x += p.x - (p.ox + Math.sin(p.t - p.moveSpeed * 0.05) * p.moveRange);
          if (p.moveAxis === 'y') player.y += p.y - (p.oy + Math.sin(p.t - p.moveSpeed * 0.05) * p.moveRange);
        }

        if (p.type === 'crumble' && p.crumbleState === 'solid') {
          landedOnCrumble = p;
        }
        if (p.type === 'spring') {
          player.vy = SPRING_FORCE;
          player.stretch = 10;
          player.onGround = false;
        }
      } else {
        // Bump head
        player.y = py + ph;
        if (player.vy < 0) player.vy = 0;
      }
    } else {
      if (overlapLeft < overlapRight) {
        player.x = px - player.w;
        if (player.vx > 0) player.vx = 0;
      } else {
        player.x = px + pw;
        if (player.vx < 0) player.vx = 0;
      }
    }
  }

  // Handle crumble
  platforms.forEach(p => {
    if (p.type === 'crumble' && p.crumbleState === 'solid' && p !== landedOnCrumble) {
      // reset timer only if player not on it
    }
    if (p.type === 'crumble' && p.crumbleState === 'solid') {
      if (p === landedOnCrumble) {
        if (p.crumbleTimer === 0) p.crumbleState = 'shaking';
      }
    }
  });
}

// ============================================================
// PLAYER UPDATE
// ============================================================
let jumpPressed = false;

function updatePlayer(dt) {
  const dtF = dt / 16.67;

  // Horizontal
  const left  = keys['ArrowLeft']  || keys['KeyA'];
  const right  = keys['ArrowRight'] || keys['KeyD'];
  const jumpKey = keys['Space'] || keys['KeyW'] || keys['ArrowUp'];

  if (left)  { player.vx -= 1.5 * dtF; if (player.vx < -MOVE_SPEED) player.vx = -MOVE_SPEED; player.dir = -1; }
  if (right) { player.vx += 1.5 * dtF; if (player.vx > MOVE_SPEED) player.vx = MOVE_SPEED; player.dir = 1; }

  // Friction
  if (!left && !right) {
    player.vx *= Math.pow(0.75, dtF);
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  // Jump
  if (jumpKey && !jumpPressed && player.onGround) {
    player.vy = JUMP_FORCE;
    player.stretch = 10;
    player.onGround = false;
  }
  jumpPressed = !!jumpKey;

  // Gravity
  player.vy += GRAVITY * dtF;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  player.x += player.vx * dtF;
  player.y += player.vy * dtF;

  // Squash/stretch
  if (player.squash > 0) player.squash--;
  if (player.stretch > 0) player.stretch--;

  // Invincibility blink
  if (player.invincible > 0) {
    player.invincible--;
    player.blinkOn = Math.floor(player.invincible / 5) % 2 === 0;
  } else {
    player.blinkOn = true;
  }
}

function checkCheckpoints() {
  checkpoints.forEach(cp => {
    if (!cp.activated) {
      const fx = cp.x, fy = cp.y - 60;
      if (rectOverlap(player.x, player.y, player.w, player.h, fx, fy, 30, 60)) {
        cp.activated = true;
        player.checkpointX = cp.x;
        player.checkpointY = cp.y;
      }
    }
  });
}

function checkGoal() {
  if (!goal) return;
  const gx = goal.x, gy = goal.y - 80;
  if (rectOverlap(player.x, player.y, player.w, player.h, gx, gy, 30, 80)) {
    totalTime += levelTime;
    state = 'levelcomplete';
    levelCompleteTimer = 0;
  }
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera() {
  const ld = LEVELS[currentLevel];
  const lookAhead = player.vx * 30;
  camTargetX = player.x - W / 2 + lookAhead;
  camTargetY = player.y - H / 2;

  camX += (camTargetX - camX) * 0.1;
  camY += (camTargetY - camY) * 0.1;

  // Clamp
  camX = Math.max(0, Math.min(camX, ld.width - W));
  camY = Math.max(-100, Math.min(camY, 400));
}

// ============================================================
// DRAWING
// ============================================================
function drawBackground() {
  const ld = LEVELS[currentLevel];
  const th = ld.theme;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, th.sky1);
  grad.addColorStop(1, th.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  const alphas = [0.25, 0.4, 0.55];
  clouds.forEach(c => {
    const sx = c.x - camX * (0.1 + c.layer * 0.1);
    const sy = c.y - camY * 0.05;
    ctx.globalAlpha = alphas[c.layer];
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(sx, sy, c.w, c.h, 10);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function darkenColor(hex, amount) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const rr = Math.max(0, r - amount);
  const gg = Math.max(0, g - amount);
  const bb = Math.max(0, b - amount);
  return `rgb(${rr},${gg},${bb})`;
}

function getRainbowColor(t) {
  const h = (t * 2) % 360;
  return `hsl(${h},100%,50%)`;
}

function drawPlatform(p) {
  if (p.type === 'crumble' && p.crumbleState === 'respawning') return;

  const pr = getPlatformRect(p);
  let { x, y, w, h } = pr;

  // Shake effect
  let sx = 0, sy = 0;
  if (p.type === 'crumble' && p.crumbleState === 'shaking') {
    sx = (Math.random() - 0.5) * 4;
    sy = (Math.random() - 0.5) * 4;
  }

  const rx = x - camX + sx;
  const ry = y - camY + sy;

  // Rainbow override for level 5
  let col = p.color;
  if (currentLevel === 4) {
    col = getRainbowColor(Date.now() * 0.001 + p.ox * 0.01);
  }

  // Shadow (3D effect)
  const dark = darkenColor(col.startsWith('hsl') ? '#888888' : col, 50);
  ctx.fillStyle = dark;
  ctx.fillRect(rx + 4, ry + 4, w, h);

  // Main platform
  ctx.fillStyle = col;
  ctx.fillRect(rx, ry, w, h);

  // Spring indicator
  if (p.type === 'spring') {
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(rx + w/2 - 8, ry - 6, 16, 8);
    ctx.fillStyle = '#FFA500';
    ctx.fillRect(rx + w/2 - 5, ry - 10, 10, 6);
  }

  // Crumble cracks
  if (p.type === 'crumble' && p.crumbleState === 'shaking') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rx + w*0.3, ry); ctx.lineTo(rx + w*0.4, ry + h);
    ctx.moveTo(rx + w*0.65, ry); ctx.lineTo(rx + w*0.55, ry + h);
    ctx.stroke();
  }
}

function drawCheckpoint(cp) {
  const px = cp.x - camX;
  const py = cp.y - camY;

  // Pole
  ctx.fillStyle = '#888';
  ctx.fillRect(px, py - 60, 4, 60);

  // Flag
  ctx.fillStyle = cp.activated ? '#00FF00' : '#AAAAAA';
  ctx.beginPath();
  ctx.moveTo(px + 4, py - 60);
  ctx.lineTo(px + 24, py - 50);
  ctx.lineTo(px + 4, py - 40);
  ctx.closePath();
  ctx.fill();

  // Base
  ctx.fillStyle = '#666';
  ctx.fillRect(px - 8, py - 6, 20, 6);
}

function drawGoal() {
  if (!goal) return;
  const px = goal.x - camX;
  const py = goal.y - camY;

  // Pole
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(px, py - 90, 5, 90);

  // Waving flag
  const wave = Math.sin(Date.now() * 0.005) * 5;
  ctx.fillStyle = '#FF4444';
  ctx.beginPath();
  ctx.moveTo(px + 5, py - 90);
  ctx.lineTo(px + 35, py - 80 + wave);
  ctx.lineTo(px + 5, py - 65);
  ctx.closePath();
  ctx.fill();

  // Base
  ctx.fillStyle = '#B8860B';
  ctx.fillRect(px - 10, py - 8, 25, 8);

  // "FINISH" text
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FINISH', px + 5, py - 100);
}

function drawPlayer() {
  if (!player.blinkOn) return;

  let pw = player.w, ph = player.h;
  let offsetY = 0;

  if (player.squash > 0) {
    const t = player.squash / 8;
    pw = player.w * (1 + 0.3 * t);
    ph = player.h * (1 - 0.2 * t);
    offsetY = player.h - ph;
  } else if (player.stretch > 0) {
    const t = player.stretch / 10;
    pw = player.w * (1 - 0.2 * t);
    ph = player.h * (1 + 0.3 * t);
    offsetY = -0.3 * t * player.h;
  }

  const px = player.x - camX + (player.w - pw) / 2;
  const py = player.y - camY + offsetY;

  // Body shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px + 4, py + ph - 4, pw, 8);

  // Body
  ctx.fillStyle = '#4488FF';
  ctx.fillRect(px, py, pw, ph);

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(px + 2, py + 2, pw / 2, ph / 3);

  // Eyes
  const eyeY = py + ph * 0.25;
  const eyeOffsetX = player.dir === 1 ? pw * 0.55 : pw * 0.15;
  const eyeSpacing = pw * 0.25;

  // White of eyes
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.ellipse(px + eyeOffsetX, eyeY, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px + eyeOffsetX + eyeSpacing, eyeY, 5, 6, 0, 0, Math.PI * 2); ctx.fill();

  // Pupils
  ctx.fillStyle = '#111';
  const pupilX = player.dir === 1 ? 2 : -2;
  ctx.beginPath(); ctx.ellipse(px + eyeOffsetX + pupilX, eyeY + 1, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px + eyeOffsetX + eyeSpacing + pupilX, eyeY + 1, 3, 4, 0, 0, Math.PI * 2); ctx.fill();

  // Feet/legs
  ctx.fillStyle = '#2255CC';
  ctx.fillRect(px + pw * 0.1, py + ph - 6, pw * 0.35, 8);
  ctx.fillRect(px + pw * 0.55, py + ph - 6, pw * 0.35, 8);
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  ctx.save();

  // Lives
  ctx.font = 'bold 22px sans-serif';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#FF3333' : '#444';
    ctx.fillText('♥', 16 + i * 28, 30);
  }

  // Level name
  const ld = LEVELS[currentLevel];
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.fillText(`LEVEL ${currentLevel + 1} - ${ld.name}`, W / 2, 28);

  // Timer
  const secs = Math.floor(levelTime / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2,'0');
  const ss = String(secs % 60).padStart(2,'0');
  ctx.textAlign = 'right';
  ctx.fillText(`${mm}:${ss}`, W - 12, 28);

  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';

  // Controls reminder
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = 'white';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('← → / A D: Move', W - 10, H - 36);
  ctx.fillText('Space / W / ↑: Jump', W - 10, H - 22);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  ctx.restore();
}

// ============================================================
// SCREENS
// ============================================================
function drawStartScreen() {
  ctx.fillStyle = '#1a1a4e';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'white';
  for (let i = 0; i < 80; i++) {
    const sx = (Math.sin(i * 137.5) * 0.5 + 0.5) * W;
    const sy = (Math.cos(i * 137.5) * 0.5 + 0.5) * H;
    ctx.fillRect(sx, sy, 2, 2);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 56px sans-serif';
  ctx.shadowColor = '#FF8C00';
  ctx.shadowBlur = 20;
  ctx.fillText('OBBY ADVENTURE', W/2, 160);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#AADDFF';
  ctx.font = '22px sans-serif';
  ctx.fillText('A Platformer Game', W/2, 200);

  ctx.fillStyle = 'white';
  ctx.font = '16px sans-serif';
  const controls = [
    'WASD / Arrow Keys → Move',
    'Space / W / ↑ → Jump',
    'Reach the FINISH flag to advance!',
    'Checkpoints save your progress.'
  ];
  controls.forEach((t, i) => ctx.fillText(t, W/2, 270 + i * 26));

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#00FF88';
  ctx.font = 'bold 20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Play', W/2, 430);

  ctx.textAlign = 'left';
}

function drawLevelCompleteScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 42px sans-serif';
  ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 15;
  ctx.fillText(`LEVEL ${currentLevel + 1} COMPLETE!`, W/2, 220);
  ctx.shadowBlur = 0;

  const secs = Math.floor(levelTime / 1000);
  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText(`Time: ${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`, W/2, 270);

  ctx.fillStyle = '#00FF88';
  ctx.font = '18px sans-serif';
  const isLast = currentLevel === LEVELS.length - 1;
  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  if (blink) ctx.fillText(isLast ? 'Press ENTER to see final results' : 'Press ENTER for Next Level', W/2, 340);

  ctx.textAlign = 'left';
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(80,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FF3333';
  ctx.font = 'bold 64px sans-serif';
  ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 30;
  ctx.fillText('GAME OVER', W/2, 230);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText('You ran out of lives!', W/2, 285);

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#FFAA00';
  ctx.font = '20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Restart', W/2, 360);

  ctx.textAlign = 'left';
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,20,40,0.9)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 52px sans-serif';
  ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 20;
  ctx.fillText('YOU WIN! 🎉', W/2, 200);
  ctx.shadowBlur = 0;

  const total = Math.floor(totalTime / 1000);
  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText(`Total Time: ${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`, W/2, 260);
  ctx.fillText('You completed all 5 levels!', W/2, 295);

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#00FF88';
  ctx.font = '20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Play Again', W/2, 380);

  ctx.textAlign = 'left';
}

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop(timestamp) {
  let dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  if (dt > 50) dt = 50; // cap
  if (dt < 1) dt = 1;

  ctx.clearRect(0, 0, W, H);

  if (state === 'start') {

    drawStartScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'gameover') {

    drawGameOverScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'win') {

    drawWinScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'play' || state === 'levelcomplete') {
    if (state === 'play') {
      levelTime += dt;
      updatePlatforms(dt);
      updateFallingBlocks(dt);
      updatePlayer(dt);
      resolveCollisions();
      checkCheckpoints();
      checkGoal();
      updateCamera();

      // Fall off screen
      if (player.y > (camY + H + 200) && player.invincible === 0) {
        die();
      }
    } else {
      levelCompleteTimer += dt;
    }

    // Apply screen shake
    let shakeX = 0, shakeY = 0;
    if (shakeTimer > 0) {
      shakeTimer -= dt;
      shakeX = (Math.random() - 0.5) * 8;
      shakeY = (Math.random() - 0.5) * 8;
      ctx.save();
      ctx.translate(shakeX, shakeY);
    }

    // Draw world
    drawBackground();
    drawClouds();

    platforms.forEach(p => drawPlatform(p));
    checkpoints.forEach(cp => drawCheckpoint(cp));
    drawGoal();
    drawFallingBlocks();
    drawPlayer();
    drawHUD();

    if (shakeTimer <= 0 && shakeX !== 0) {
      // shakeTimer might have gone negative
    }
    if (shakeX !== 0) ctx.restore();

    // Red flash overlay
    if (flashTimer > 0) {
      flashTimer -= dt;
      const alpha = Math.min(1, (flashTimer / 300) * 0.7);
      ctx.fillStyle = `rgba(255,0,0,${alpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'levelcomplete') {
      drawLevelCompleteScreen();
    }
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
loadLevel(0);
requestAnimationFrame(ts => { lastTimestamp = ts; requestAnimationFrame(gameLoop); });
</script>
