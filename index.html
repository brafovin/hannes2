// ── Falling Red Blocks ──────────────────────────────────────
// How many blocks spawn per level (index = level 0..4)
const BLOCKS_PER_LEVEL = [1, 2, 3, 5, 7];
let fallingBlocks = [];
let blockSpawnTimer = 0;
// Spawn interval in ms: gets shorter each level
const BLOCK_SPAWN_INTERVAL = [3500, 2800, 2000, 1400, 900];

function spawnFallingBlock() {
  const ld = LEVELS[currentLevel];
  // Spawn above the visible area at a random x near the player
  const spread = 300;
  const spawnX = player.x - spread + Math.random() * spread * 2;
  const sz = 18 + Math.random() * 18; // size 18–36
  fallingBlocks.push({
    x: spawnX,
    y: camY - 60,
    w: sz, h: sz,
    vy: 3 + Math.random() * 3,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 0.12,
    alive: true,
    warningX: spawnX, // for ground shadow
  });
}

function updateFallingBlocks(dt) {
  if (state !== 'play') return;
  const dtF = dt / 16.67;
  const count = BLOCKS_PER_LEVEL[currentLevel];
  const interval = BLOCK_SPAWN_INTERVAL[currentLevel];

  blockSpawnTimer += dt;
  // Spawn up to `count` blocks concurrently; keep refilling
  if (blockSpawnTimer >= interval && fallingBlocks.filter(b => b.alive).length < count) {
    blockSpawnTimer = 0;
    spawnFallingBlock();
  }

  fallingBlocks.forEach(b => {
    if (!b.alive) return;
    b.vy = Math.min(b.vy + 0.08 * dtF, 6);
    b.y += b.vy * dtF;
    b.rotation += b.rotSpeed * dtF;

    // Remove when far below screen
    if (b.y > camY + H + 200) {
      b.alive = false;
    }

    // Hit player
    if (player.invincible === 0 &&
        rectOverlap(player.x, player.y, player.w, player.h, b.x, b.y, b.w, b.h)) {
      b.alive = false;
      die();
    }
  });

  // Clean up dead blocks
  if (fallingBlocks.length > 60) fallingBlocks = fallingBlocks.filter(b => b.alive);
}

function drawFallingBlocks() {
  const t = Date.now() * 0.001;
  fallingBlocks.forEach((b, bi) => {
    if (!b.alive) return;

    const cx = b.x - camX + b.w / 2;
    const cy = b.y - camY + b.h / 2;
    const r  = b.w / 2;

    // ── Feuer-Schweif (Partikel-Trail oben am Stein) ──────────
    for (let i = 0; i < 8; i++) {
      const trailAge = i / 8;
      const ty = cy - b.h * 0.5 - i * b.h * 0.45;
      const tx = cx + Math.sin(t * 6 + i * 1.3 + bi) * r * 0.4;
      const tr = r * (1 - trailAge) * 0.7;
      const ta = (1 - trailAge) * 0.55;
      // Orange → Gelb → Transparent
      const heat = Math.floor(255 * (1 - trailAge * 0.5));
      const green = Math.floor(180 * (1 - trailAge));
      ctx.fillStyle = `rgba(${heat},${green},0,${ta})`;
      ctx.beginPath();
      ctx.arc(tx, ty, tr, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(b.rotation);

    // ── Äußeres Glühen ────────────────────────────────────────
    const glowPulse = 0.7 + 0.3 * Math.sin(t * 8 + bi);
    const glow = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.2);
    glow.addColorStop(0, `rgba(255,140,0,${0.5 * glowPulse})`);
    glow.addColorStop(0.5, `rgba(255,60,0,${0.25 * glowPulse})`);
    glow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // ── Stein-Körper (unregelmäßiges Polygon) ─────────────────
    const sides = 7;
    const noiseSeeds = b.noiseSeeds || (b.noiseSeeds = Array.from({length: sides}, () => 0.75 + Math.random() * 0.5));
    ctx.beginPath();
    for (let i = 0; i <= sides; i++) {
      const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
      const pr = r * noiseSeeds[i % sides];
      if (i === 0) ctx.moveTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
      else ctx.lineTo(Math.cos(angle) * pr, Math.sin(angle) * pr);
    }
    ctx.closePath();

    // Stein-Gradient: dunkelgrau im Kern, glühend orange am Rand
    const stoneGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 0, 0, 0, r * 1.1);
    stoneGrad.addColorStop(0,   '#555550');
    stoneGrad.addColorStop(0.4, '#3a3830');
    stoneGrad.addColorStop(0.75,'#6b3010');
    stoneGrad.addColorStop(1,   '#cc4400');
    ctx.fillStyle = stoneGrad;
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 18 * glowPulse;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ── Risse im Stein ────────────────────────────────────────
    ctx.strokeStyle = 'rgba(255,120,0,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, -r * 0.5); ctx.lineTo(r * 0.3,  r * 0.2);
    ctx.moveTo(-r * 0.4,  r * 0.1); ctx.lineTo(-r * 0.1, r * 0.55);
    ctx.moveTo( r * 0.15,-r * 0.1); ctx.lineTo( r * 0.5, r * 0.3);
    ctx.stroke();

    // ── Glühende Riss-Lava ────────────────────────────────────
    const lavaPulse = 0.5 + 0.5 * Math.sin(t * 10 + bi * 2);
    ctx.strokeStyle = `rgba(255,${Math.floor(200 * lavaPulse)},0,${0.7 * lavaPulse})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, -r * 0.5); ctx.lineTo(r * 0.3,  r * 0.2);
    ctx.moveTo(-r * 0.4,  r * 0.1); ctx.lineTo(-r * 0.1, r * 0.55);
    ctx.stroke();

    // ── Flackernde Flammen oben am Stein ──────────────────────
    for (let f = 0; f < 4; f++) {
      const fx = (f / 4 - 0.5) * r * 1.4;
      const flicker = Math.sin(t * 12 + f * 2.1 + bi) * 0.4 + 0.6;
      const fh = r * (0.6 + flicker * 0.5);
      const fg = ctx.createLinearGradient(fx, -r * 0.5, fx, -r * 0.5 - fh);
      fg.addColorStop(0,   `rgba(255,120,0,0.9)`);
      fg.addColorStop(0.4, `rgba(255,200,0,0.7)`);
      fg.addColorStop(1,   `rgba(255,255,100,0)`);
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.ellipse(fx + Math.sin(t * 8 + f) * 2, -r * 0.5 - fh * 0.5, r * 0.18, fh * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    // ── Boden-Schatten (orangefarbig wie Lava) ────────────────
    const shadowY = camY + H - 30;
    if (b.y < shadowY) {
      const dist = shadowY - b.y;
      const alpha = Math.max(0, 0.35 - dist / (H * 1.5));
      const scale = Math.max(0.2, 1 - dist / H);
      ctx.save();
      ctx.globalAlpha = alpha;
      const sg = ctx.createRadialGradient(cx, shadowY - camY, 0, cx, shadowY - camY, b.w * scale);
      sg.addColorStop(0, 'rgba(255,80,0,0.8)');
      sg.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.ellipse(cx, shadowY - camY, b.w * scale, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') handleEnter();

  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function handleEnter() {
  if (state === 'start') {
    startGame();
  } else if (state === 'levelcomplete') {
    if (currentLevel < LEVELS.length - 1) {
      currentLevel++;
      loadLevel(currentLevel);
      state = 'play';
    } else {
      state = 'win';
    }
  } else if (state === 'gameover') {
    lives = 10; currentLevel = 0; totalTime = 0;
    loadLevel(0);
    state = 'play';
  } else if (state === 'win') {
    lives = 10; currentLevel = 0; totalTime = 0;
    loadLevel(0);
    state = 'play';
  }
}

function startGame() {
  lives = 10; currentLevel = 0; totalTime = 0;
  loadLevel(0);
  state = 'play';
}

// LEVEL LOADING
// ============================================================
function loadLevel(idx) {
  const ld = LEVELS[idx];
  levelTime = 0;
  galaxyGenerated = false;
  flyingPlanets = [];
  planetTimer = 0;

  // Build platform runtime objects
  platforms = ld.platforms.map((p, i) => ({
    ...p,
    ox: p.x, oy: p.y,    // original position
    t: Math.random() * Math.PI * 2, // phase offset
    crumbleState: 'solid', // solid, shaking, falling, respawning
    crumbleTimer: 0,
    crumbleY: p.y,
    id: i
  }));

  checkpoints = ld.checkpoints.map(c => ({ ...c, activated: false }));
  goal = { ...ld.goal };

  // Reset player
  player.x = 100;
  player.y = 200;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.squash = 0; player.stretch = 0;
  player.invincible = 0;
  player.checkpointX = 100;
  player.checkpointY = 200;

  // Reset falling blocks
  fallingBlocks = [];
  blockSpawnTimer = 0;

  // Camera
  camX = player.x - W / 2;
  camY = player.y - H / 2;

  // Generate clouds
  clouds = [];
  const lw = ld.width + 800;
  for (let layer = 0; layer < 3; layer++) {
    for (let i = 0; i < 12; i++) {
      clouds.push({
        x: Math.random() * lw,
        y: 30 + Math.random() * 200,
        w: 60 + Math.random() * 100,
        h: 20 + Math.random() * 30,
        layer: layer,
        speed: 0.1 + layer * 0.15
      });
    }
  }
}

// ============================================================
// RESPAWN / DEATH
// ============================================================
function die() {
  lives--;
  flashTimer = 18; // ~0.3s
  shakeTimer = 12;
  if (lives <= 0) {
    state = 'gameover';
    return;
  }
  respawn();
}

function respawn() {
  player.x = player.checkpointX;
  player.y = player.checkpointY - PLAYER_H - 10;
  player.vx = 0; player.vy = 0;
  player.invincible = 60; // 1 second at 60fps
}

// ============================================================
// PLATFORM HELPERS
// ============================================================
function getPlatformRect(p) {
  if (p.crumbleState === 'falling') {
    return { x: p.x, y: p.crumbleY, w: p.w, h: p.h };
  }
  return { x: p.x, y: p.y, w: p.w, h: p.h };
}

function updatePlatforms(dt) {
  const dtFactor = dt / 16.67; // normalize to 60fps
  platforms.forEach(p => {
    if (p.type === 'moving') {
      p.t += p.moveSpeed * dtFactor * 0.05;
      if (p.moveAxis === 'x') {
        p.x = p.ox + Math.sin(p.t) * p.moveRange;
      } else {
        p.y = p.oy + Math.sin(p.t) * p.moveRange;
      }
    }
    if (p.type === 'crumble') {
      if (p.crumbleState === 'shaking') {
        p.crumbleTimer += dt;
        if (p.crumbleTimer >= 700) { // 0.7s of shaking (0.8s total contact)
          p.crumbleState = 'falling';
          p.crumbleTimer = 0;
          p.crumbleY = p.y;
        }
      } else if (p.crumbleState === 'falling') {
        p.crumbleTimer += dt;
        p.crumbleY += 4 * dtFactor;
        if (p.crumbleTimer >= 1500) {
          p.crumbleState = 'respawning';
          p.crumbleTimer = 0;
        }
      } else if (p.crumbleState === 'respawning') {
        p.crumbleTimer += dt;
        if (p.crumbleTimer >= 3000) {
          p.crumbleState = 'solid';
          p.crumbleTimer = 0;
          p.crumbleY = p.y;
        }
      }
    }
  });
}

// ============================================================
// COLLISION
// ============================================================
function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function resolveCollisions() {
  player.onGround = false;
  let landedOnCrumble = null;

  for (const p of platforms) {
    if (p.type === 'crumble' && (p.crumbleState === 'falling' || p.crumbleState === 'respawning')) continue;

    const pr = getPlatformRect(p);
    const px = pr.x, py = pr.y, pw = pr.w, ph = pr.h;

    if (!rectOverlap(player.x, player.y, player.w, player.h, px, py, pw, ph)) continue;

    const overlapLeft  = (player.x + player.w) - px;
    const overlapRight = (px + pw) - player.x;
    const overlapTop   = (player.y + player.h) - py;
    const overlapBottom= (py + ph) - player.y;

    const minX = Math.min(overlapLeft, overlapRight);
    const minY = Math.min(overlapTop, overlapBottom);

    if (minY < minX) {
      if (overlapTop < overlapBottom) {
        // Landing on top
        player.y = py - player.h;
        if (player.vy > 0) {
          // Squash on landing
          if (player.vy > 6) player.squash = 8;
          player.vy = 0;
        }
        player.onGround = true;

        // Move with moving platform
        if (p.type === 'moving') {
          const prevX = p.ox + Math.sin(p.t - p.moveSpeed * 0.05) * (p.moveAxis === 'x' ? p.moveRange : 0);
          const prevY = p.oy + Math.sin(p.t - p.moveSpeed * 0.05) * (p.moveAxis === 'y' ? p.moveRange : 0);
          if (p.moveAxis === 'x') player.x += p.x - (p.ox + Math.sin(p.t - p.moveSpeed * 0.05) * p.moveRange);
          if (p.moveAxis === 'y') player.y += p.y - (p.oy + Math.sin(p.t - p.moveSpeed * 0.05) * p.moveRange);
        }

        if (p.type === 'crumble' && p.crumbleState === 'solid') {
          landedOnCrumble = p;
        }
        if (p.type === 'spring') {
          player.vy = SPRING_FORCE;
          player.stretch = 10;
          player.onGround = false;
        }
      } else {
        // Bump head
        player.y = py + ph;
        if (player.vy < 0) player.vy = 0;
      }
    } else {
      if (overlapLeft < overlapRight) {
        player.x = px - player.w;
        if (player.vx > 0) player.vx = 0;
      } else {
        player.x = px + pw;
        if (player.vx < 0) player.vx = 0;
      }
    }
  }

  // Handle crumble
  platforms.forEach(p => {
    if (p.type === 'crumble' && p.crumbleState === 'solid' && p !== landedOnCrumble) {
      // reset timer only if player not on it
    }
    if (p.type === 'crumble' && p.crumbleState === 'solid') {
      if (p === landedOnCrumble) {
        if (p.crumbleTimer === 0) p.crumbleState = 'shaking';
      }
    }
  });
}

// ============================================================
// PLAYER UPDATE
// ============================================================
let jumpPressed = false;
let airJumps = 0; // extra jumps used in air

function updatePlayer(dt) {
  const dtF = dt / 16.67;

  // Horizontal
  const left   = keys['ArrowLeft']  || keys['KeyA'];
  const right  = keys['ArrowRight'] || keys['KeyD'];
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const jumpKey = keys['Space'] || keys['KeyW'] || keys['ArrowUp'];

  const maxSpd = sprint ? SPRINT_SPEED : MOVE_SPEED;
  const accel  = sprint ? 2.5 : 1.5;

  if (left)  { player.vx -= accel * dtF; if (player.vx < -maxSpd) player.vx = -maxSpd; player.dir = -1; }
  if (right) { player.vx += accel * dtF; if (player.vx > maxSpd)  player.vx = maxSpd;  player.dir = 1; }

  // Friction
  if (!left && !right) {
    player.vx *= Math.pow(0.75, dtF);
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  // Reset air jumps when on ground
  if (player.onGround) airJumps = 0;

  // Jump — 1 ground jump + 4 air jumps = 5 total
  if (jumpKey && !jumpPressed) {
    const jumpsLeft = MAX_JUMPS - 1 - airJumps; // -1 for ground jump
    if (player.onGround) {
      player.vy = JUMP_FORCE;
      player.stretch = 10;
      player.onGround = false;
    } else if (airJumps < MAX_JUMPS - 1) {
      player.vy = JUMP_FORCE * 0.9;
      player.stretch = 8;
      airJumps++;
    }
  }
  jumpPressed = !!jumpKey;

  // Gravity
  player.vy += GRAVITY * dtF;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  player.x += player.vx * dtF;
  player.y += player.vy * dtF;

  // Squash/stretch
  if (player.squash > 0) player.squash--;
  if (player.stretch > 0) player.stretch--;

  // Invincibility blink
  if (player.invincible > 0) {
    player.invincible--;
    player.blinkOn = Math.floor(player.invincible / 5) % 2 === 0;
  } else {
    player.blinkOn = true;
  }
}

function checkCheckpoints() {
  checkpoints.forEach(cp => {
    if (!cp.activated) {
      const fx = cp.x, fy = cp.y - 60;
      if (rectOverlap(player.x, player.y, player.w, player.h, fx, fy, 30, 60)) {
        cp.activated = true;
        player.checkpointX = cp.x;
        player.checkpointY = cp.y;
      }
    }
  });
}

function checkGoal() {
  if (!goal) return;
  const gx = goal.x, gy = goal.y - 80;
  if (rectOverlap(player.x, player.y, player.w, player.h, gx, gy, 30, 80)) {
    totalTime += levelTime;
    state = 'levelcomplete';
    levelCompleteTimer = 0;
    spawnConfetti();
  }
}

// ============================================================
// CAMERA
// ============================================================
function updateCamera() {
  const ld = LEVELS[currentLevel];
  const lookAhead = player.vx * 30;
  camTargetX = player.x - W / 2 + lookAhead;
  camTargetY = player.y - H / 2;

  camX += (camTargetX - camX) * 0.1;
  camY += (camTargetY - camY) * 0.1;

  // Clamp
  camX = Math.max(0, Math.min(camX, ld.width - W));
  camY = Math.max(-100, Math.min(camY, 400));
}

// ============================================================
// DRAWING
// ============================================================
// ── Galaxie-Hintergrund ───────────────────────────────────
// Sterne werden einmal pro Level generiert und bleiben fest
let galaxyStars = [];
let galaxyNebulae = [];
let galaxyGenerated = false;

function generateGalaxy() {
  galaxyStars = [];
  galaxyNebulae = [];
  const lw = (LEVELS[currentLevel]?.width || 2200) + W;

  // Hintere Sterne (viele, klein, langsam)
  for (let i = 0; i < 350; i++) {
    galaxyStars.push({
      x: Math.random() * lw,
      y: Math.random() * H,
      r: 0.4 + Math.random() * 1.2,
      bright: 0.4 + Math.random() * 0.6,
      twinkleOffset: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.02 + Math.random() * 0.04,
      layer: 0, // parallax layer
    });
  }
  // Mittlere Sterne
  for (let i = 0; i < 150; i++) {
    galaxyStars.push({
      x: Math.random() * lw,
      y: Math.random() * H,
      r: 0.8 + Math.random() * 1.8,
      bright: 0.6 + Math.random() * 0.4,
      twinkleOffset: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.03 + Math.random() * 0.05,
      layer: 1,
    });
  }
  // Vordere helle Sterne
  for (let i = 0; i < 50; i++) {
    galaxyStars.push({
      x: Math.random() * lw,
      y: Math.random() * H,
      r: 1.5 + Math.random() * 2.5,
      bright: 0.8 + Math.random() * 0.2,
      twinkleOffset: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.015 + Math.random() * 0.03,
      layer: 2,
      hasGlow: true,
    });
  }

  // Nebel-Wolken (bunte Gaswolken)
  const nebulaColors = [
    'rgba(100,60,200,', 'rgba(200,40,100,', 'rgba(40,100,200,',
    'rgba(60,180,200,', 'rgba(180,60,180,', 'rgba(40,140,100,',
  ];
  for (let i = 0; i < 12; i++) {
    galaxyNebulae.push({
      x: Math.random() * lw,
      y: Math.random() * H,
      rx: 80 + Math.random() * 160,
      ry: 50 + Math.random() * 100,
      color: nebulaColors[Math.floor(Math.random() * nebulaColors.length)],
      alpha: 0.04 + Math.random() * 0.08,
      layer: Math.floor(Math.random() * 2),
    });
  }

  galaxyGenerated = true;
}

function drawBackground() {
  if (!galaxyGenerated) generateGalaxy();

  // Tiefes Weltraum-Schwarz mit leichtem Farbton je Level
  const levelTints = [
    ['#000008','#00000f'],
    ['#000510','#000820'],
    ['#050005','#0a000f'],
    ['#080200','#0f0500'],
    ['#000000','#030005'],
  ];
  const tint = levelTints[currentLevel] || ['#000008','#00000f'];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, tint[0]);
  grad.addColorStop(1, tint[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() * 0.001;
  const parallaxFactor = [0.05, 0.12, 0.22];

  // Nebel
  galaxyNebulae.forEach(n => {
    const px = n.x - camX * parallaxFactor[n.layer];
    const sx = ((px % (W + n.rx * 2)) + W + n.rx * 2) % (W + n.rx * 2) - n.rx;
    const sy = n.y;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(n.rx, n.ry));
    g.addColorStop(0, n.color + (n.alpha * 1.5) + ')');
    g.addColorStop(1, n.color + '0)');
    ctx.fillStyle = g;
    ctx.save();
    ctx.scale(1, n.ry / n.rx);
    ctx.beginPath();
    ctx.arc(sx, sy * (n.rx / n.ry), n.rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Milchstraßenband (helles Band diagonal)
  const mwGrad = ctx.createLinearGradient(0, H * 0.15, W, H * 0.65);
  mwGrad.addColorStop(0,   'rgba(80,60,120,0)');
  mwGrad.addColorStop(0.3, 'rgba(100,80,160,0.07)');
  mwGrad.addColorStop(0.5, 'rgba(140,120,200,0.10)');
  mwGrad.addColorStop(0.7, 'rgba(100,80,160,0.07)');
  mwGrad.addColorStop(1,   'rgba(80,60,120,0)');
  ctx.fillStyle = mwGrad;
  ctx.fillRect(0, 0, W, H);

  // Sterne zeichnen
  galaxyStars.forEach(s => {
    const px = s.x - camX * parallaxFactor[s.layer];
    const sx = ((px % (W + 10)) + W + 10) % (W + 10) - 5;
    const sy = s.y;

    const twinkle = s.bright * (0.6 + 0.4 * Math.sin(t * s.twinkleSpeed * 60 + s.twinkleOffset));

    if (s.hasGlow) {
      // Helle Sterne mit Glühen
      const gGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 5);
      gGrad.addColorStop(0, `rgba(255,255,255,${twinkle * 0.9})`);
      gGrad.addColorStop(0.3, `rgba(200,220,255,${twinkle * 0.4})`);
      gGrad.addColorStop(1, 'rgba(100,140,255,0)');
      ctx.fillStyle = gGrad;
      ctx.beginPath();
      ctx.arc(sx, sy, s.r * 5, 0, Math.PI * 2);
      ctx.fill();

      // Kreuzförmiger Lens-Flare
      ctx.strokeStyle = `rgba(200,220,255,${twinkle * 0.35})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(sx - s.r * 8, sy); ctx.lineTo(sx + s.r * 8, sy);
      ctx.moveTo(sx, sy - s.r * 8); ctx.lineTo(sx, sy + s.r * 8);
      ctx.stroke();
    }

    // Stern-Kern
    const starColor = s.layer === 2
      ? `rgba(220,235,255,${twinkle})`
      : s.layer === 1
      ? `rgba(200,215,255,${twinkle})`
      : `rgba(180,195,240,${twinkle})`;
    ctx.fillStyle = starColor;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Entfernte Mini-Galaxie (Spirale)
  drawDistantGalaxy(W * 0.78 - camX * 0.03, H * 0.22, 28, t * 0.1);
  drawDistantGalaxy(W * 0.25 - camX * 0.02, H * 0.72, 18, -t * 0.08);

  // Vorbeifliegende Planeten
  drawFlyingPlanets(t);
}

// ── Vorbeifliegende Planeten alle 10 Sekunden ─────────────────
const PLANET_CONFIGS = [
  { colors: ['#e8a87c','#c47c3e','#f0c060'], rings: true,  ringColor: '#d4a04080', name: 'Saturn-like' },
  { colors: ['#6ab0e8','#3a7ab8','#90d0f8'], rings: false, ringColor: null,        name: 'Ice Giant'  },
  { colors: ['#e87060','#b03020','#f09080'], rings: false, ringColor: null,        name: 'Mars-like'  },
  { colors: ['#80c870','#50a040','#b0e890'], rings: true,  ringColor: '#60a05050', name: 'Gas Giant'  },
  { colors: ['#e8d880','#c0a830','#f8f090'], rings: false, ringColor: null,        name: 'Desert'     },
  { colors: ['#c0a0e8','#8060c0','#e0c8ff'], rings: true,  ringColor: '#a080d060', name: 'Purple Gas' },
];
let flyingPlanets = [];
let planetTimer = 0;

function spawnFlyingPlanet() {
  const cfg = PLANET_CONFIGS[Math.floor(Math.random() * PLANET_CONFIGS.length)];
  const size = 28 + Math.random() * 44;
  const fromLeft = Math.random() < 0.5;
  flyingPlanets.push({
    x: fromLeft ? -size * 2 : W + size * 2,
    y: 40 + Math.random() * (H * 0.55),
    vx: (fromLeft ? 1 : -1) * (0.25 + Math.random() * 0.4),
    size,
    cfg,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.004,
    alpha: 0,
  });
}

function updateFlyingPlanets(dt) {
  planetTimer += dt;
  if (planetTimer >= 10000) {
    planetTimer = 0;
    spawnFlyingPlanet();
  }
  flyingPlanets.forEach(p => {
    p.x += p.vx * (dt / 16.67);
    p.rot += p.rotSpeed;
    // Fade in/out
    const onScreen = p.x > -p.size * 2 && p.x < W + p.size * 2;
    p.alpha = onScreen ? Math.min(1, p.alpha + 0.01) : Math.max(0, p.alpha - 0.02);
  });
  flyingPlanets = flyingPlanets.filter(p => p.x > -p.size * 4 && p.x < W + p.size * 4);
}

function drawFlyingPlanets(t) {
  flyingPlanets.forEach(p => {
    if (p.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = p.alpha * 0.88;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);

    const { colors, rings, ringColor } = p.cfg;
    const r = p.size;

    // Ringe hinter dem Planeten
    if (rings) {
      ctx.save();
      ctx.scale(1, 0.28);
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = r * 0.22;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.55, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = r * 0.10;
      ctx.strokeStyle = ringColor.replace('80','50');
      ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Planet-Körper
    const planetGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r);
    planetGrad.addColorStop(0,   colors[2]);
    planetGrad.addColorStop(0.5, colors[0]);
    planetGrad.addColorStop(1,   colors[1]);
    ctx.fillStyle = planetGrad;
    ctx.shadowColor = colors[0];
    ctx.shadowBlur = r * 0.6;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Atmosphäre-Streifen
    ctx.save();
    ctx.clip();  // nur innerhalb des Planeten
    ctx.globalAlpha *= 0.18;
    for (let s = 0; s < 5; s++) {
      const sy = -r + s * r * 0.45;
      ctx.fillStyle = s % 2 === 0 ? '#ffffff' : colors[1];
      ctx.fillRect(-r, sy, r * 2, r * 0.2);
    }
    ctx.restore();

    // Glanzpunkt
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.35, r * 0.32, r * 0.18, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawDistantGalaxy(cx, cy, size, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  // Kern
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.4);
  core.addColorStop(0, 'rgba(255,240,200,0.25)');
  core.addColorStop(1, 'rgba(200,160,255,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2); ctx.fill();
  // Spiralarme
  for (let arm = 0; arm < 2; arm++) {
    ctx.save();
    ctx.rotate(arm * Math.PI);
    for (let i = 0; i < 30; i++) {
      const angle = i * 0.25;
      const dist = i * (size / 30);
      const sx = Math.cos(angle) * dist;
      const sy = Math.sin(angle) * dist * 0.4;
      const alpha = (1 - i / 30) * 0.18;
      ctx.fillStyle = `rgba(180,160,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(sx, sy, (size / 30) * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawClouds() { /* ersetzt durch Galaxie */ }

function darkenColor(hex, amount) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const rr = Math.max(0, r - amount);
  const gg = Math.max(0, g - amount);
  const bb = Math.max(0, b - amount);
  return `rgb(${rr},${gg},${bb})`;
}

function getRainbowColor(t) {
  const h = (t * 2) % 360;
  return `hsl(${h},100%,50%)`;
}

function drawPlatform(p) {
  if (p.type === 'crumble' && p.crumbleState === 'respawning') return;

  const pr = getPlatformRect(p);
  let { x, y, w, h } = pr;

  // Shake effect
  let sx = 0, sy = 0;
  if (p.type === 'crumble' && p.crumbleState === 'shaking') {
    sx = (Math.random() - 0.5) * 4;
    sy = (Math.random() - 0.5) * 4;
  }

  const rx = x - camX + sx;
  const ry = y - camY + sy;

  // Rainbow override for level 5
  let col = p.color;
  if (currentLevel === 4) {
    col = getRainbowColor(Date.now() * 0.001 + p.ox * 0.01);
  }

  // Shadow (3D effect)
  const dark = darkenColor(col.startsWith('hsl') ? '#888888' : col, 50);
  ctx.fillStyle = dark;
  ctx.fillRect(rx + 4, ry + 4, w, h);

  // Main platform
  ctx.fillStyle = col;
  ctx.fillRect(rx, ry, w, h);

  // Spring indicator
  if (p.type === 'spring') {
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(rx + w/2 - 8, ry - 6, 16, 8);
    ctx.fillStyle = '#FFA500';
    ctx.fillRect(rx + w/2 - 5, ry - 10, 10, 6);
  }

  // Crumble cracks
  if (p.type === 'crumble' && p.crumbleState === 'shaking') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rx + w*0.3, ry); ctx.lineTo(rx + w*0.4, ry + h);
    ctx.moveTo(rx + w*0.65, ry); ctx.lineTo(rx + w*0.55, ry + h);
    ctx.stroke();
  }
}

function drawCheckpoint(cp) {
  const px = cp.x - camX;
  const py = cp.y - camY;

  // Pole
  ctx.fillStyle = '#888';
  ctx.fillRect(px, py - 60, 4, 60);

  // Flag
  ctx.fillStyle = cp.activated ? '#00FF00' : '#AAAAAA';
  ctx.beginPath();
  ctx.moveTo(px + 4, py - 60);
  ctx.lineTo(px + 24, py - 50);
  ctx.lineTo(px + 4, py - 40);
  ctx.closePath();
  ctx.fill();

  // Base
  ctx.fillStyle = '#666';
  ctx.fillRect(px - 8, py - 6, 20, 6);
}

function drawGoal() {
  if (!goal) return;
  const px = goal.x - camX;
  const py = goal.y - camY;

  // Pole
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(px, py - 90, 5, 90);

  // Waving flag
  const wave = Math.sin(Date.now() * 0.005) * 5;
  ctx.fillStyle = '#FF4444';
  ctx.beginPath();
  ctx.moveTo(px + 5, py - 90);
  ctx.lineTo(px + 35, py - 80 + wave);
  ctx.lineTo(px + 5, py - 65);
  ctx.closePath();
  ctx.fill();

  // Base
  ctx.fillStyle = '#B8860B';
  ctx.fillRect(px - 10, py - 8, 25, 8);

  // "FINISH" text
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('FINISH', px + 5, py - 100);
}

function drawPlayer() {
  if (!player.blinkOn) return;

  let pw = player.w, ph = player.h;
  let offsetY = 0;

  if (player.squash > 0) {
    const t = player.squash / 8;
    pw = player.w * (1 + 0.3 * t);
    ph = player.h * (1 - 0.2 * t);
    offsetY = player.h - ph;
  } else if (player.stretch > 0) {
    const t = player.stretch / 10;
    pw = player.w * (1 - 0.2 * t);
    ph = player.h * (1 + 0.3 * t);
    offsetY = -0.3 * t * player.h;
  }

  const px = player.x - camX + (player.w - pw) / 2;
  const py = player.y - camY + offsetY;
  const cx = px + pw / 2;   // Mittelpunkt X
  const isSprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const t = Date.now() * 0.006;

  ctx.save();
  ctx.translate(cx, py + ph);       // Ursprung = Bodenmitte Spieler

  const W2 = pw / 2, H2 = ph;

  // ── Bodenschatten ─────────────────────────────────────────
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(0, 2, W2 * 0.9, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Beine / Stiefel ───────────────────────────────────────
  const legSwing = player.onGround ? Math.sin(t * (isSprint ? 2.5 : 1.5)) * 5 : 0;
  // Linker Stiefel
  ctx.fillStyle = '#dde8f0';
  ctx.beginPath();
  ctx.roundRect(-W2 * 0.45, -H2 * 0.22 + legSwing, W2 * 0.4, H2 * 0.22, 4);
  ctx.fill();
  // Rechter Stiefel
  ctx.beginPath();
  ctx.roundRect(W2 * 0.05, -H2 * 0.22 - legSwing, W2 * 0.4, H2 * 0.22, 4);
  ctx.fill();
  // Stiefel-Sohle dunkel
  ctx.fillStyle = '#aab8c2';
  ctx.fillRect(-W2 * 0.45, -H2 * 0.03 + legSwing, W2 * 0.4, H2 * 0.04);
  ctx.fillRect(W2 * 0.05, -H2 * 0.03 - legSwing, W2 * 0.4, H2 * 0.04);

  // ── Rucksack (Lebenserhaltungssystem) ─────────────────────
  const backDir = player.dir === 1 ? -1 : 1;
  ctx.fillStyle = '#b0c4d8';
  ctx.beginPath();
  ctx.roundRect(backDir * W2 * 0.3, -H2 * 0.82, W2 * 0.38, H2 * 0.42, 4);
  ctx.fill();
  ctx.fillStyle = '#7a9ab0';
  ctx.fillRect(backDir * W2 * 0.34, -H2 * 0.78, W2 * 0.3, H2 * 0.1);
  // Schläuche
  ctx.strokeStyle = '#607d8b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(backDir * W2 * 0.3, -H2 * 0.55);
  ctx.lineTo(backDir * W2 * 0.15, -H2 * 0.48);
  ctx.stroke();

  // ── Raumanzug-Körper ──────────────────────────────────────
  const suitGrad = ctx.createLinearGradient(-W2, -H2, W2, -H2 * 0.35);
  suitGrad.addColorStop(0,   '#c8d8e8');
  suitGrad.addColorStop(0.4, '#e8f0f8');
  suitGrad.addColorStop(1,   '#b0c0d0');
  ctx.fillStyle = suitGrad;
  ctx.beginPath();
  ctx.roundRect(-W2 * 0.82, -H2 * 0.88, pw * 0.82, H2 * 0.66, 8);
  ctx.fill();

  // Schulterstreifen (orange wie NASA)
  ctx.fillStyle = '#ff6600';
  ctx.fillRect(-W2 * 0.82, -H2 * 0.88, pw * 0.82, H2 * 0.07);
  ctx.fillRect(-W2 * 0.82, -H2 * 0.58, pw * 0.82, H2 * 0.05);

  // Brust-Panel mit Knöpfen
  ctx.fillStyle = '#90a8c0';
  ctx.beginPath();
  ctx.roundRect(-W2 * 0.38, -H2 * 0.74, W2 * 0.76, H2 * 0.24, 4);
  ctx.fill();
  // Knöpfe
  const btnColors = ['#ff4444','#44ff44','#ffff44','#4488ff'];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = btnColors[i];
    ctx.beginPath();
    ctx.arc(-W2 * 0.27 + i * W2 * 0.18, -H2 * 0.62, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Arme ──────────────────────────────────────────────────
  const armSwing = player.onGround ? -legSwing * 0.6 : 0;
  // Linker Arm
  ctx.fillStyle = '#d0e0ee';
  ctx.beginPath();
  ctx.roundRect(-W2 * 0.95, -H2 * 0.86 + armSwing, W2 * 0.3, H2 * 0.38, 6);
  ctx.fill();
  // Linker Handschuh
  ctx.fillStyle = '#b0c8d8';
  ctx.beginPath();
  ctx.ellipse(-W2 * 0.8, -H2 * 0.48 + armSwing, W2 * 0.2, W2 * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();
  // Rechter Arm
  ctx.beginPath();
  ctx.roundRect(W2 * 0.65, -H2 * 0.86 - armSwing, W2 * 0.3, H2 * 0.38, 6);
  ctx.fill();
  // Rechter Handschuh
  ctx.fillStyle = '#b0c8d8';
  ctx.beginPath();
  ctx.ellipse(W2 * 0.8, -H2 * 0.48 - armSwing, W2 * 0.2, W2 * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Helm ──────────────────────────────────────────────────
  // Helm-Körper (weißer Kreis)
  ctx.fillStyle = '#e8f0f8';
  ctx.beginPath();
  ctx.arc(0, -H2 * 0.92, W2 * 0.78, 0, Math.PI * 2);
  ctx.fill();
  // Helm-Rand (grau)
  ctx.strokeStyle = '#90a8b8';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Visier (goldenes Glas)
  const visierDir = player.dir === 1 ? 0.08 : -0.08;
  const visGrad = ctx.createRadialGradient(
    visierDir * pw, -H2 * 0.92, 0,
    visierDir * pw, -H2 * 0.92, W2 * 0.52
  );
  visGrad.addColorStop(0,   'rgba(255,220,80,0.95)');
  visGrad.addColorStop(0.6, 'rgba(210,150,0,0.85)');
  visGrad.addColorStop(1,   'rgba(150,90,0,0.7)');
  ctx.fillStyle = visGrad;
  ctx.beginPath();
  ctx.ellipse(visierDir * pw, -H2 * 0.92, W2 * 0.52, W2 * 0.44, 0, 0, Math.PI * 2);
  ctx.fill();

  // Visier-Glanzpunkt
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.ellipse(visierDir * pw - W2 * 0.18, -H2 * 1.01, W2 * 0.18, W2 * 0.1, -0.4, 0, Math.PI * 2);
  ctx.fill();

  // Helm-Antenne
  ctx.strokeStyle = '#607d8b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W2 * 0.55, -H2 * 1.08);
  ctx.lineTo(W2 * 0.7,  -H2 * 1.22);
  ctx.stroke();
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.arc(W2 * 0.72, -H2 * 1.24, 3, 0, Math.PI * 2);
  ctx.fill();

  // Sprint-Thruster-Effekt
  if (isSprint) {
    ctx.fillStyle = `rgba(0,180,255,${0.4 + 0.3 * Math.sin(t * 10)})`;
    ctx.beginPath();
    ctx.ellipse(-W2 * 0.8 - 4, -H2 * 0.48 + armSwing, 6, 10, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(W2 * 0.8 + 4, -H2 * 0.48 - armSwing, 6, 10, -0.3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ============================================================
// HUD
// ============================================================
function drawHUD() {
  ctx.save();

  // Lives — 10 Herzen in 2 Reihen à 5
  ctx.font = 'bold 18px sans-serif';
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i < lives ? '#FF3333' : '#333';
    const row = Math.floor(i / 5);
    const col = i % 5;
    ctx.fillText('♥', 12 + col * 22, 22 + row * 18);
  }

  // Level name
  const ld = LEVELS[currentLevel];
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.fillText(`LEVEL ${currentLevel + 1} - ${ld.name}`, W / 2, 28);

  // Timer
  const secs = Math.floor(levelTime / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2,'0');
  const ss = String(secs % 60).padStart(2,'0');
  ctx.textAlign = 'right';
  ctx.fillText(`${mm}:${ss}`, W - 12, 28);

  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';

  // Controls reminder
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = 'white';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('← → / A D: Move  |  Shift: Sprint  |  Space / W / ↑: Springen (5x)', W - 10, H - 10);
  ctx.globalAlpha = 1;

  // Sprung-Anzeige (kleine Herzen = Sprünge übrig)
  const jumpsLeft = MAX_JUMPS - airJumps - (player.onGround ? 0 : 1);
  const jumpsUsable = player.onGround ? MAX_JUMPS : Math.max(0, MAX_JUMPS - 1 - airJumps);
  ctx.textAlign = 'left';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('Sprünge:', 12, H - 10);
  for (let i = 0; i < MAX_JUMPS; i++) {
    ctx.fillStyle = i < (player.onGround ? MAX_JUMPS : Math.max(0, MAX_JUMPS - 1 - airJumps))
      ? '#00e5ff' : 'rgba(255,255,255,0.2)';
    ctx.fillText('▲', 80 + i * 18, H - 10);
  }

  // Sprint-Anzeige
  const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
  if (isSprinting) {
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ SPRINT ⚡', W / 2, H - 10);
  }
  ctx.textAlign = 'left';

  ctx.restore();
}

// ============================================================
// KONFETTI MIT KEKSEN
// ============================================================
let confettiParticles = [];

function spawnConfetti() {
  confettiParticles = [];
  const colors = ['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#1abc9c','#e67e22','#ff69b4'];
  for (let i = 0; i < 100; i++) {
    const isCookie = i < 100; // alle 100 sind Kekse
    confettiParticles.push({
      x: Math.random() * W,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 4,
      vy: 0.8 + Math.random() * 1.2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.15,
      size: 18 + Math.random() * 12,
      color: colors[Math.floor(Math.random() * colors.length)],
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.05 + Math.random() * 0.05,
      isCookie: true,
      alpha: 1,
    });
  }
}

function updateConfetti(dt) {
  const dtF = dt / 16.67;
  confettiParticles.forEach(p => {
    p.wobble += p.wobbleSpeed * dtF;
    p.x += (p.vx + Math.sin(p.wobble) * 1.2) * dtF;
    p.y += p.vy * dtF;
    p.rot += p.rotSpeed * dtF;
    // Fade out near bottom
    if (p.y > H * 0.75) p.alpha = Math.max(0, p.alpha - 0.008 * dtF);
    // Respawn at top so confetti keeps going
    if (p.y > H + 30 || p.alpha <= 0) {
      p.x = Math.random() * W;
      p.y = -20;
      p.alpha = 1;
    }
  });
}

function drawConfetti() {
  confettiParticles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.font = `${p.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍪', 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
}

// ============================================================
// SCREENS
// ============================================================
function drawStartScreen() {
  ctx.fillStyle = '#1a1a4e';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'white';
  for (let i = 0; i < 80; i++) {
    const sx = (Math.sin(i * 137.5) * 0.5 + 0.5) * W;
    const sy = (Math.cos(i * 137.5) * 0.5 + 0.5) * H;
    ctx.fillRect(sx, sy, 2, 2);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 56px sans-serif';
  ctx.shadowColor = '#FF8C00';
  ctx.shadowBlur = 20;
  ctx.fillText('OBBY ADVENTURE', W/2, 160);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#AADDFF';
  ctx.font = '22px sans-serif';
  ctx.fillText('A Platformer Game', W/2, 200);

  ctx.fillStyle = 'white';
  ctx.font = '16px sans-serif';
  const controls = [
    'WASD / Arrow Keys → Move',
    'Space / W / ↑ → Jump',
    'Reach the FINISH flag to advance!',
    'Checkpoints save your progress.'
  ];
  controls.forEach((t, i) => ctx.fillText(t, W/2, 270 + i * 26));

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#00FF88';
  ctx.font = 'bold 20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Play', W/2, 430);

  ctx.textAlign = 'left';
}

function drawLevelCompleteScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 42px sans-serif';
  ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 15;
  ctx.fillText(`LEVEL ${currentLevel + 1} COMPLETE!`, W/2, 220);
  ctx.shadowBlur = 0;

  const secs = Math.floor(levelTime / 1000);
  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText(`Time: ${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`, W/2, 270);

  ctx.fillStyle = '#00FF88';
  ctx.font = '18px sans-serif';
  const isLast = currentLevel === LEVELS.length - 1;
  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  if (blink) ctx.fillText(isLast ? 'Press ENTER to see final results' : 'Press ENTER for Next Level', W/2, 340);

  ctx.textAlign = 'left';
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(80,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FF3333';
  ctx.font = 'bold 64px sans-serif';
  ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 30;
  ctx.fillText('GAME OVER', W/2, 230);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText('You ran out of lives!', W/2, 285);

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#FFAA00';
  ctx.font = '20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Restart', W/2, 360);

  ctx.textAlign = 'left';
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,20,40,0.9)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 52px sans-serif';
  ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 20;
  ctx.fillText('YOU WIN! 🎉', W/2, 200);
  ctx.shadowBlur = 0;

  const total = Math.floor(totalTime / 1000);
  ctx.fillStyle = 'white';
  ctx.font = '22px sans-serif';
  ctx.fillText(`Total Time: ${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`, W/2, 260);
  ctx.fillText('You completed all 5 levels!', W/2, 295);

  const blink = Math.floor(Date.now() / 500) % 2 === 0;
  ctx.fillStyle = '#00FF88';
  ctx.font = '20px sans-serif';
  if (blink) ctx.fillText('Press ENTER to Play Again', W/2, 380);

  ctx.textAlign = 'left';
}

// ============================================================
// MAIN LOOP
// ============================================================
function gameLoop(timestamp) {
  let dt = timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  if (dt > 50) dt = 50; // cap
  if (dt < 1) dt = 1;

  ctx.clearRect(0, 0, W, H);

  if (state === 'start') {

    drawStartScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'gameover') {

    drawGameOverScreen();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'win') {
    updateConfetti(dt);
    drawWinScreen();
    drawConfetti();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (state === 'play' || state === 'levelcomplete') {
    if (state === 'play') {
      levelTime += dt;
      updatePlatforms(dt);
      updateFallingBlocks(dt);
      updateFlyingPlanets(dt);
      updatePlayer(dt);
      resolveCollisions();
      checkCheckpoints();
      checkGoal();
      updateCamera();

      // Fall off screen
      if (player.y > (camY + H + 200) && player.invincible === 0) {
        die();
      }
    } else {
      levelCompleteTimer += dt;
    }

    // Apply screen shake
    let shakeX = 0, shakeY = 0;
    if (shakeTimer > 0) {
      shakeTimer -= dt;
      shakeX = (Math.random() - 0.5) * 8;
      shakeY = (Math.random() - 0.5) * 8;
      ctx.save();
      ctx.translate(shakeX, shakeY);
    }

    // Draw world
    drawBackground();
    drawClouds();

    platforms.forEach(p => drawPlatform(p));
    checkpoints.forEach(cp => drawCheckpoint(cp));
    drawGoal();
    drawFallingBlocks();
    drawPlayer();
    drawHUD();

    if (shakeTimer <= 0 && shakeX !== 0) {
      // shakeTimer might have gone negative
    }
    if (shakeX !== 0) ctx.restore();

    // Red flash overlay
    if (flashTimer > 0) {
      flashTimer -= dt;
      const alpha = Math.min(1, (flashTimer / 300) * 0.7);
      ctx.fillStyle = `rgba(255,0,0,${alpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'levelcomplete') {
      updateConfetti(dt);
      drawConfetti();
      drawLevelCompleteScreen();
    }
  }

  requestAnimationFrame(gameLoop);
}

// ============================================================
// INIT
// ============================================================
loadLevel(0);
requestAnimationFrame(ts => { lastTimestamp = ts; requestAnimationFrame(gameLoop); });
</script>
